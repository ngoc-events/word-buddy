<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridge-Lexi</title>
<meta name="description" content="Tra từ Nga ⇄ Anh kiểu chat, có câu ví dụ và bản dịch. Không cần đăng nhập.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --text:#1d2433; --muted:#6b7385; --line:#e3e7ef;
  --user:#3d5afe; --user-text:#fff; --bot:#ffffff;
  --ru:#d9480f; --ru-bg:#fff0e6; --en:#0b7a75; --en-bg:#e3f6f4;
  --chip:#eef1f8; --shadow:0 1px 3px rgba(20,30,60,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11141b; --panel:#191d27; --text:#e6e9f0; --muted:#9aa2b4; --line:#2a3040;
    --user:#5c74ff; --bot:#1e2330; --ru:#ff9a5c; --ru-bg:#3a2417; --en:#4fd1c5; --en-bg:#16332f;
    --chip:#232838; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ru),var(--user));color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px}
header h1{font-size:17px;margin:0;font-weight:600}
header p{margin:0;font-size:12px;color:var(--muted)}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:760px;width:100%;margin:0 auto}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;box-shadow:var(--shadow);word-wrap:break-word}
.user{align-self:flex-end;background:var(--user);color:var(--user-text);border-bottom-right-radius:4px;font-weight:500}
.bot{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:4px;width:88%}
.bot .note{color:var(--muted);font-size:13px}
.sense{padding:10px 0;border-top:1px solid var(--line)}
.sense:first-of-type{border-top:none;padding-top:2px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px}
.num{color:var(--muted);font-size:13px;min-width:16px}
.word{font-weight:600;font-size:17px;color:var(--ru)}
.pos{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--chip);padding:1px 7px;border-radius:99px}
.meaning{font-weight:500}
.ex{margin:6px 0 0 24px;padding:8px 10px;border-left:3px solid var(--line);border-radius:0 8px 8px 0;background:var(--chip)}
.ex .ru{display:flex;gap:6px;align-items:flex-start}
.ex .en{color:var(--muted);font-size:14px;margin-top:2px}
mark{border-radius:4px;padding:0 3px;font-weight:600}
mark.r{background:var(--ru-bg);color:var(--ru)}
mark.e{background:var(--en-bg);color:var(--en)}
.say{border:none;background:none;cursor:pointer;font-size:14px;padding:0 2px;opacity:.7;flex:none}
.say:hover{opacity:1}
.src{margin-top:8px;font-size:12px}
.src a{color:var(--muted)}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:99px;padding:3px 11px;font:inherit;font-size:13px;cursor:pointer}
footer{background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
form{display:flex;gap:8px;max-width:760px;margin:0 auto}
input{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none}
input:focus{border-color:var(--user)}
button.send{border:none;border-radius:99px;background:var(--user);color:#fff;font:inherit;font-weight:600;padding:0 18px;cursor:pointer}
button.send:disabled{opacity:.5}
.credit{text-align:center;font-size:11px;color:var(--muted);margin-top:6px}
.credit a{color:inherit}
</style>
</head>
<body>
<header>
  <div class="logo">Bл</div>
  <div><h1>Bridge-Lexi</h1><p>Nga ⇄ Anh · gõ một từ để tra</p></div>
</header>

<main id="chat" aria-live="polite"></main>

<footer>
  <form id="f" autocomplete="off">
    <input id="q" placeholder="Nhập từ tiếng Nga hoặc tiếng Anh…" aria-label="Từ cần tra" autofocus>
    <button class="send" id="go">Gửi</button>
  </form>
  <div class="credit">Dữ liệu: <a href="https://en.wiktionary.org" target="_blank" rel="noopener">Wiktionary</a> (CC BY-SA 4.0)</div>
</footer>

<script>
/* ===== Bridge-Lexi — tra từ Nga ⇄ Anh, chạy hoàn toàn trên trình duyệt =====
   Nguồn dữ liệu: Wiktionary MediaWiki API (miễn phí, không cần khoá, hỗ trợ CORS với origin=*) */

const API = 'https://en.wiktionary.org/w/api.php';
const MAX_SENSES = 4;          // số nghĩa tối đa cho từ Nga
const MAX_EN_GROUPS = 3;       // số nhóm nghĩa tối đa cho từ Anh
const MAX_RU_PER_GROUP = 2;    // số từ Nga tối đa mỗi nhóm
const POS = ['Noun','Verb','Adjective','Adverb','Pronoun','Preposition','Conjunction','Interjection',
  'Numeral','Particle','Phrase','Proverb','Determiner','Participle','Predicative','Prepositional phrase','Idiom'];
const STOP = new Set(['the','a','an','to','of','or','and','be','in','on','for','with','as','by','at','from','something','someone','one','that','which','its','any','some']);
const cache = new Map();

/* ---------- tiện ích ---------- */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const noStress = s => s.normalize('NFD').replace(/[\u0300\u0301]/g,'').normalize('NFC');
const isCyr = s => /[а-яё]/i.test(s);
const isLat = s => /[a-z]/i.test(s);
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

async function wiki(page, prop){
  const key = prop + ':' + page;
  if (cache.has(key)) return cache.get(key);
  const url = `${API}?action=parse&page=${encodeURIComponent(page)}&prop=${prop}&format=json&formatversion=2&redirects=1&origin=*`;
  const p = fetch(url).then(r => r.json()).then(j => j.error ? null : (prop === 'text' ? j.parse.text : j.parse.wikitext)).catch(() => null);
  cache.set(key, p);
  return p;
}

/* Chuyển phần tử HTML thành chuỗi an toàn, <b>/<strong> → <mark> */
function rich(el, cls){
  let out = '';
  el.childNodes.forEach(n => {
    if (n.nodeType === 3) out += esc(n.textContent);
    else if (n.nodeType === 1){
      if (n.matches('sup, .e-transliteration, .tr, .mention-gloss-paren')) return;
      if (/^(B|STRONG)$/.test(n.tagName)) out += `<mark class="${cls}">${esc(n.textContent)}</mark>`;
      else out += rich(n, cls);
    }
  });
  return out;
}

/* Bôi màu từ tiếng Nga trong câu (bỏ qua dấu trọng âm khi so khớp) */
function markRu(html, word){
  if (html.includes('<mark')) return html;
  const base = noStress(word).toLowerCase();
  const stem = base.length > 4 ? base.slice(0, base.length - 2) : base;
  const pat = [...stem].map(ch => reEsc(ch) + '\u0301?').join('');
  const re = new RegExp(`(^|[^а-яё\u0301])(${pat}[а-яё\u0301]*)`, 'gi');
  return html.replace(re, (m, pre, w) => `${pre}<mark class="r">${w}</mark>`);
}

/* Bôi màu từ tiếng Anh trong câu dịch */
function markEn(html, keywords){
  if (html.includes('<mark')) return html;
  for (const k of keywords){
    if (!k || k.length < 2 || STOP.has(k.toLowerCase())) continue;
    const stem = k.length > 4 && /e$/i.test(k) ? k.slice(0,-1) : k;
    const re = new RegExp(`\\b(${reEsc(stem)}[a-z]*)\\b`, 'i');
    if (re.test(html)) return html.replace(re, '<mark class="e">$1</mark>');
  }
  return html;
}

function keywordsOf(text){
  const first = text.split(/[;,(]/)[0];
  return first.split(/[^A-Za-z'-]+/).filter(w => w.length > 1 && !STOP.has(w.toLowerCase()));
}

/* ---------- Nga → Anh ---------- */
async function lookupRu(word, depth = 0){
  const html = await wiki(word, 'text');
  if (!html) return null;
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const h2 = doc.querySelector('h2#Russian');
  if (!h2) return null;
  const start = h2.closest('.mw-heading') || h2;

  const senses = []; const forms = [];
  let pos = '', headword = word;
  for (let n = start.nextElementSibling; n; n = n.nextElementSibling){
    if (n.matches('.mw-heading2, h2')) break;
    const h = n.matches('.mw-heading') ? n.querySelector('h3,h4,h5') : (n.matches('h3,h4,h5') ? n : null);
    if (h){ const t = h.textContent.trim(); pos = POS.includes(t) ? t : ''; continue; }
    if (!pos) continue;
    if (n.matches('p')){ const hw = n.querySelector('.headword'); if (hw) headword = hw.textContent.trim(); continue; }
    if (!n.matches('ol')) continue;
    for (const li of n.children){
      if (li.tagName !== 'LI') continue;
      const fo = li.querySelector('.form-of-definition-link a, .form-of-definition a');
      if (fo){ const lemma = (fo.getAttribute('title') || fo.textContent).split('#')[0].trim(); if (lemma) forms.push(lemma); continue; }
      const c = li.cloneNode(true);
      c.querySelectorAll('dl,ul,ol,sup,.HQToggle,.maintenance-line,style').forEach(x => x.remove());
      const def = c.textContent.replace(/\s+/g,' ').trim();
      if (!def) continue;
      let ex = null;
      for (const dd of li.querySelectorAll(':scope > dl > dd')){
        const e = dd.querySelector('.e-example'), t = dd.querySelector('.e-translation');
        if (e && t && e.textContent.length < 140){ ex = { ru: rich(e,'r'), en: rich(t,'e') }; break; }
      }
      senses.push({ pos, headword, def, ex });
    }
  }

  // Từ nhập là dạng biến cách/chia (vd. "кошку") → tra từ gốc
  if (!senses.length && forms.length && depth === 0){
    const lemma = noStress(forms[0]);
    const r = await lookupRu(lemma, 1);
    if (r) r.note = `«${word}» là một dạng của «${forms[0]}».`;
    return r;
  }
  if (!senses.length) return null;

  // Ưu tiên nghĩa có câu ví dụ, giữ thứ tự gốc
  const withEx = senses.filter(s => s.ex), without = senses.filter(s => !s.ex);
  const picked = [...withEx, ...without].slice(0, MAX_SENSES)
    .sort((a, b) => senses.indexOf(a) - senses.indexOf(b));
  picked.forEach(s => {
    if (s.ex){ s.ex.ru = markRu(s.ex.ru, s.headword); s.ex.en = markEn(s.ex.en, keywordsOf(s.def)); }
  });
  return { page: word, senses: picked };
}

/* ---------- Anh → Nga ---------- */
function section(wt, lang){
  const m = new RegExp(`^==\\s*${lang}\\s*==\\s*$`, 'm').exec(wt);
  if (!m) return '';
  const rest = wt.slice(m.index + m[0].length);
  const n = /^==[^=].*==\s*$/m.exec(rest);
  return n ? rest.slice(0, n.index) : rest;
}

function parseTrans(wt){
  const groups = [];
  const re = /\{\{trans-top(?:-also)?((?:\|[^}]*)?)\}\}([\s\S]*?)\{\{trans-bottom\}\}/g;
  let m;
  while ((m = re.exec(wt))){
    const params = m[1].split('|').slice(1).filter(p => !p.includes('='));
    const gloss = (params[0] || '').replace(/\[\[(?:[^|\]]*\|)?([^\]]*)\]\]/g,'$1').replace(/'''?/g,'').trim();
    const line = /^\*\s*Russian:(.*)$/m.exec(m[2]);
    if (!line) continue;
    const words = [];
    for (const t of line[1].matchAll(/\{\{t(?:t)?\+?\|ru\|([^|}]+)/g)){
      const w = t[1].replace(/\[\[(?:[^|\]]*\|)?([^\]]*)\]\]/g,'$1').trim();
      if (w && !words.includes(w)) words.push(w);
    }
    if (words.length) groups.push({ gloss, words: words.slice(0, MAX_RU_PER_GROUP) });
  }
  return groups;
}

async function lookupEn(word){
  let wt = await wiki(word, 'wikitext');
  if (!wt && word !== word.toLowerCase()) wt = await wiki(word.toLowerCase(), 'wikitext');
  if (!wt) return null;
  let groups = parseTrans(section(wt, 'English'));
  if (!groups.length){
    const sub = await wiki(word + '/translations', 'wikitext');
    if (sub) groups = parseTrans(sub);
  }
  if (!groups.length) return null;
  groups = groups.slice(0, MAX_EN_GROUPS);

  const kw = [word, ...keywordsOf(word)];
  const items = [];
  await Promise.all(groups.flatMap(g => g.words.map(async (ruWord, i) => {
    const r = await lookupRu(noStress(ruWord));
    let ex = null;
    if (r){
      const gl = g.gloss.toLowerCase(), w = word.toLowerCase();
      const best = r.senses.find(s => s.ex && s.def.toLowerCase().includes(w))
                || r.senses.find(s => s.ex && gl && keywordsOf(gl).some(k => s.def.toLowerCase().includes(k.toLowerCase())))
                || r.senses.find(s => s.ex);
      if (best){
        ex = { ru: best.ex.ru, en: best.ex.en.replace(/<mark class="e">([^<]*)<\/mark>/g,'$1') };
        ex.en = markEn(ex.en, kw);
      }
    }
    items.push({ order: groups.indexOf(g) * 10 + i, ru: ruWord, gloss: g.gloss, ex, page: noStress(ruWord) });
  })));
  items.sort((a, b) => a.order - b.order);
  return { page: word, items };
}

/* ---------- giao diện ---------- */
function bubble(cls, html){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = html;
  $('#chat').appendChild(d);
  d.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return d;
}

const sayBtn = text => `<button class="say" title="Nghe" data-say="${esc(text)}">🔊</button>`;
const exBlock = ex => ex
  ? `<div class="ex"><div class="ru">${sayBtn(ex.ru.replace(/<[^>]+>/g,''))}<span>${ex.ru}</span></div><div class="en">${ex.en}</div></div>`
  : `<div class="ex"><div class="en">Chưa có câu ví dụ trên Wiktionary.</div></div>`;
const srcLink = page => `<div class="src"><a href="https://en.wiktionary.org/wiki/${encodeURIComponent(page)}" target="_blank" rel="noopener">Xem đầy đủ trên Wiktionary ↗</a></div>`;

function renderRu(r){
  let h = r.note ? `<div class="note">${esc(r.note)}</div>` : '';
  r.senses.forEach((s, i) => {
    h += `<div class="sense"><div class="head"><span class="num">${i+1}.</span><span class="pos">${esc(s.pos)}</span><span class="meaning">${esc(s.def)}</span></div>${exBlock(s.ex)}</div>`;
  });
  return h + srcLink(r.page);
}

function renderEn(r){
  let h = '';
  r.items.forEach((it, i) => {
    h += `<div class="sense"><div class="head"><span class="num">${i+1}.</span><span class="word">${esc(it.ru)}</span>${it.gloss ? `<span class="pos">${esc(it.gloss)}</span>` : ''}</div>${exBlock(it.ex)}</div>`;
  });
  return h + srcLink(r.page);
}

async function ask(raw){
  const q = raw.trim().replace(/\s+/g,' ');
  if (!q) return;
  bubble('user', esc(q));
  const wait = bubble('bot', '<div class="typing"><span></span><span></span><span></span></div>');
  $('#go').disabled = true;
  try {
    let html;
    if (isCyr(q)){
      const w = noStress(q).toLowerCase();
      const r = await lookupRu(w) || await lookupRu(noStress(q));
      html = r ? renderRu(r) : `<div class="note">Không tìm thấy «${esc(q)}». Thử nhập dạng nguyên mẫu (vd. động từ ở dạng -ть, danh từ ở số ít).</div>`;
    } else if (isLat(q)){
      const r = await lookupEn(q.toLowerCase()) || await lookupEn(q);
      html = r ? renderEn(r) : `<div class="note">Không tìm thấy bản dịch tiếng Nga cho «${esc(q)}». Thử một từ đơn giản hơn.</div>`;
    } else {
      html = '<div class="note">Hãy nhập một từ tiếng Nga (chữ Kirin) hoặc tiếng Anh.</div>';
    }
    wait.innerHTML = html;
  } catch (e){
    wait.innerHTML = '<div class="note">Lỗi kết nối tới Wiktionary. Kiểm tra mạng rồi thử lại.</div>';
  }
  $('#go').disabled = false;
  wait.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

$('#f').addEventListener('submit', e => { e.preventDefault(); const v = $('#q').value; $('#q').value = ''; ask(v); $('#q').focus(); });
$('#chat').addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (chip) return ask(chip.textContent);
  const s = e.target.closest('.say');
  if (s && 'speechSynthesis' in window){
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(noStress(s.dataset.say)); u.lang = 'ru-RU'; u.rate = .9;
    speechSynthesis.speak(u);
  }
});

bubble('bot', `Привет! 👋 Gõ một từ <b>tiếng Nga</b> để xem nghĩa tiếng Anh, hoặc một từ <b>tiếng Anh</b> để xem từ tiếng Nga tương ứng — kèm câu ví dụ.
<div class="chips"><button class="chip">кошка</button><button class="chip">читать</button><button class="chip">книгу</button><button class="chip">happy</button><button class="chip">house</button></div>`);
</script>
</body>
</html>

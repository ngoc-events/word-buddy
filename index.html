<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Buddy">
<meta name="theme-color" content="#F3F8FF">
<style>html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}body{margin:0}</style>
<title>Word Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen chat — header, scrolling thread, composer pinned to the bottom */
:root{
  --bg:#F3F8FF; --surface:#FFFFFF; --ink:#192F60; --muted:#5D6F93; --line:#DCE7F7;
  --accent:#238CF4; --accent-ink:#FFFFFF; --ru:#FF454D; --ru-soft:#FFE3E5; --en:#0E9F6E; --en-soft:#D7F5E8;
  --user:#238CF4; --user-ink:#FFFFFF; --chip:#E7F1FE;
  --f-display:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A33; --surface:#17264A; --ink:#EAF2FF; --muted:#9FB2D6; --line:#25386A;
  --accent:#4BA3FF; --accent-ink:#0B1530; --ru:#FF6B72; --ru-soft:#4A2131; --en:#3DD49B; --en-soft:#163F3A;
  --user:#2F7FD6; --user-ink:#FFFFFF; --chip:#1F3363; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1A33; --surface:#17264A; --ink:#EAF2FF; --muted:#9FB2D6; --line:#25386A;
  --accent:#4BA3FF; --accent-ink:#0B1530; --ru:#FF6B72; --ru-soft:#4A2131; --en:#3DD49B; --en-soft:#163F3A;
  --user:#2F7FD6; --user-ink:#FFFFFF; --chip:#1F3363; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;overflow:hidden}
*{box-sizing:border-box}
.app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{display:flex;align-items:center;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;flex:none}
header h1{font-family:var(--f-display);font-size:20px;font-weight:700;margin:0}
.ver{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}
header p{margin:2px 0 0;font-size:13px;color:var(--muted);font-weight:500}
.clear{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);font:600 13px var(--f-body);border-radius:999px;padding:6px 12px;cursor:pointer}

.thread{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:16px 8px;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:8px;align-items:flex-end;min-width:0}
.row.me{justify-content:flex-end}
.bubble-me{background:var(--user);color:var(--user-ink);padding:9px 14px;border-radius:18px 18px 4px 18px;font-weight:600;font-size:17px;max-width:80%;overflow-wrap:anywhere}
.avatar{width:30px;height:30px;flex:none}
.reply{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
.dir{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.head{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 10px}
.word{font-family:var(--f-display);font-size:21px;font-weight:600}
.word.ru{color:var(--ru)} .word.en{color:var(--en)}
.pos{font-size:12px;font-weight:500;color:var(--muted);background:var(--chip);border-radius:6px;padding:2px 7px}
.meaning{font-size:16px;font-weight:500;line-height:1.4}
.meaning .num{color:var(--muted)}
.ex{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.ex .src{font-size:16px;font-weight:500;line-height:1.45}
.ex .tr{font-size:14.5px;color:var(--muted);font-weight:400;line-height:1.45}
mark{border-radius:5px;padding:0 3px;font-weight:600}
mark.ru{background:var(--ru-soft);color:var(--ru)}
mark.en{background:var(--en-soft);color:var(--en)}
.say{border:none;background:var(--chip);color:var(--accent);width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;flex:none;vertical-align:middle}
.say svg{width:15px;height:15px}
.line{display:flex;align-items:flex-start;gap:6px}
.line > span{flex:1;min-width:0}
.note{font-size:14px;color:var(--muted);font-weight:500}
.typing{display:inline-flex;gap:5px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.example-tag{font-size:11px;font-weight:600;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase}
.err{color:var(--ru);font-weight:500;font-size:14px}

.composer{border-top:1px solid var(--line);background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips button{flex:none;border:none;background:var(--chip);color:var(--ink);font:500 14px var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:500 17px var(--f-body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:11px 16px;outline:none}
input:focus{border-color:var(--accent)}
.send{flex:none;width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer}
.send:disabled{opacity:.45;cursor:default}
.send svg{width:20px;height:20px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.typing i{animation:none}}
</style>

</head>
<body>
<div class="app">
  <header class="gutter">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <rect x="2" y="4" width="30" height="24" rx="9" fill="var(--accent)"/>
      <path d="M9 28l-2 7 8-7z" fill="var(--accent)"/>
      <rect x="14" y="14" width="24" height="20" rx="8" fill="var(--ru)"/>
      <text x="17" y="21" font-family="Nunito,sans-serif" font-size="11" font-weight="700" fill="#fff">Aa</text>
      <text x="22" y="31" font-family="Nunito,sans-serif" font-size="9" font-weight="700" fill="#fff">Яя</text>
    </svg>
    <div>
      <h1>Word Buddy<span class="ver">ver_3</span></h1>
      <p>Russian ⇄ English</p>
    </div>
    <button class="clear" id="clear" type="button">Clear</button>
  </header>

  <main class="thread gutter" id="thread" aria-live="polite"></main>

  <div class="composer gutter">
    <div class="chips" id="chips"></div>
    <form id="form" autocomplete="off">
      <input id="q" type="text" placeholder="Type a Russian or English word…" enterkeyhint="send" autocapitalize="off" spellcheck="false" maxlength="60" aria-label="Word">
      <button class="send" id="send" type="submit" aria-label="Look up">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </div>
</div>

<script>
const SPEAK_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
const AVATAR='<svg class="avatar" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="14" fill="var(--accent)"/><circle cx="11" cy="13" r="2" fill="#fff"/><circle cx="19" cy="13" r="2" fill="#fff"/><path d="M10 19q5 4 10 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';

const thread=document.getElementById('thread');
const form=document.getElementById('form');
const input=document.getElementById('q');
const sendBtn=document.getElementById('send');

const EXAMPLES=[
  {query:"дом",data:{direction:"ru-en",entries:[
    {word:"дом",pos:"noun",meaning:"house, building",example:{text:"Наш [[дом]] очень большой.",translation:"Our [[house]] is very big."}},
    {word:"дом",pos:"noun",meaning:"home",example:{text:"Я иду [[домой]].",translation:"I'm going [[home]]."}}]}},
  {query:"happy",data:{direction:"en-ru",entries:[
    {word:"счастли́вый",pos:"adjective",meaning:"happy (deeply, in life)",example:{text:"Она очень [[счастливая]].",translation:"She is very [[happy]]."}},
    {word:"рад",pos:"short adjective",meaning:"happy, glad (about something)",example:{text:"Я [[рад]] тебя видеть!",translation:"I'm [[happy]] to see you!"}}]}}
];
const CHIPS=["спасибо","книга","идти","beautiful","to eat","friend"];

let examplesShown=true;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hl(s,lang){return esc(s).replace(/\[\[(.+?)\]\]/g,`<mark class="${lang}">$1</mark>`)}
function plain(s){return String(s??'').replace(/\[\[|\]\]/g,'').replace(/́/g,'')}
function scrollDown(){thread.scrollTop=thread.scrollHeight}

/* Russian audio via the browser's own voices */
let ruVoice=null;
function pickVoice(){try{ruVoice=speechSynthesis.getVoices().find(v=>/^ru/i.test(v.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plain(t));u.lang='ru-RU';if(ruVoice)u.voice=ruVoice;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const canSpeak='speechSynthesis' in window;
function sayBtn(text){return canSpeak?`<button class="say" type="button" data-say="${esc(text)}" aria-label="Listen">${SPEAK_ICON}</button>`:''}

function addMe(text){
  const r=document.createElement('div');r.className='row me';
  r.innerHTML=`<div class="bubble-me">${esc(text)}</div>`;thread.append(r);scrollDown();
}
function addBot(){
  const r=document.createElement('div');r.className='row';
  r.innerHTML=AVATAR+'<div class="reply"><div class="typing" aria-label="Looking up"><i></i><i></i><i></i></div></div>';
  thread.append(r);scrollDown();return r.querySelector('.reply');
}
function renderReply(box,data){
  const ruToEn=data.direction!=='en-ru';
  const entries=Array.isArray(data.entries)?data.entries:[];
  if(!entries.length){box.innerHTML=`<div class="card"><div class="note">${esc(data.note||"I couldn't find that word. Check the spelling and try again.")}</div></div>`;return}
  let h=`<div class="dir">${ruToEn?'Russian → English':'English → Russian'}</div>`;
  entries.forEach((e,i)=>{
    const ex=e.example||{};
    const ruText=ruToEn?ex.text:ex.text;   // example.text is always the Russian sentence
    const head=ruToEn
      ? `<div class="head"><span class="word ru">${esc(e.word)}</span>${sayBtn(e.word)}${e.pos?`<span class="pos">${esc(e.pos)}</span>`:''}</div><div class="meaning">${entries.length>1?'<span class="num">'+(i+1)+'.</span> ':''}${esc(e.meaning)}</div>`
      : `<div class="head"><span class="word ru">${esc(e.word)}</span>${sayBtn(e.word)}${e.pos?`<span class="pos">${esc(e.pos)}</span>`:''}</div><div class="meaning">${esc(e.meaning)}</div>`;
    h+=`<div class="card">${head}
      <div class="ex">
        <div class="line"><span class="src">${hl(ruText,'ru')}</span>${sayBtn(ruText)}</div>
        <div class="tr">${hl(ex.translation,'en')}</div>
      </div></div>`;
  });
  if(data.note)h+=`<div class="note">${esc(data.note)}</div>`;
  box.innerHTML=h;
}

thread.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)speak(b.dataset.say)});

function showExamples(){
  thread.innerHTML='<div class="example-tag">Examples · type your own word below</div>';
  for(const ex of EXAMPLES){addMe(ex.query);renderReply(addBot(),ex.data)}
  thread.scrollTop=0;examplesShown=true;
}

const chips=document.getElementById('chips');
CHIPS.forEach(w=>{const b=document.createElement('button');b.type='button';b.textContent=w;b.onclick=()=>lookup(w);chips.append(b)});
document.getElementById('clear').onclick=()=>{thread.innerHTML='';examplesShown=false;input.focus()};

// ▼▼▼ Paste your Cloudflare Worker address here (step 3.6) ▼▼▼
const WORKER_URL = "https://word-buddy.YOUR-NAME.workers.dev";
// ▲▲▲

let busy=false;
const MSG={
  429:"Too many lookups right now. Wait a minute, then try again.",
  400:"Type a shorter word or phrase, then try again.",
  bad:"The answer came back garbled. Tap send to try again.",
  net:"Can't reach Word Buddy's server. Check your internet connection, then try again.",
  setup:"Word Buddy isn't connected yet: put your Worker address in WORKER_URL."
};

async function lookup(raw){
  const word=raw.trim();if(!word||busy)return;
  if(examplesShown){thread.innerHTML='';examplesShown=false}
  busy=true;sendBtn.disabled=true;input.value='';
  addMe(word);const box=addBot();
  try{
    if(WORKER_URL.includes('YOUR-NAME')){box.innerHTML=`<div class="card"><div class="err">${MSG.setup}</div></div>`;return}
    let res;
    try{res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({word:word.toLowerCase()})})}
    catch(e){throw {code:'net'}}
    if(!res.ok)throw {code:res.status};
    const data=await res.json().catch(()=>{throw {code:'bad'}});
    renderReply(box,data&&typeof data==='object'?data:{entries:[]});
  }catch(e){
    box.innerHTML=`<div class="card"><div class="err">${esc(MSG[e&&e.code]||"Something went wrong. Tap send to try again.")}</div></div>`;
  }finally{busy=false;sendBtn.disabled=false;scrollDown()}
}

form.addEventListener('submit',e=>{e.preventDefault();lookup(input.value)});
showExamples();
</script>
</body>
</html>
